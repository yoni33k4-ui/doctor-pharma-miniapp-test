<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>Doctor Pharma 33</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      padding: 20px 16px 35px;
    }

    .app {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
    }

    /* ===== LOGO ===== */

    .logo-box {
      width: 100%;
      height: 205px;
      background: #000;
      border-radius: 22px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      margin-bottom: 22px;
    }

    .logo-box img {
      width: 100%;
      height: 255px;
      object-fit: cover;
      object-position: center 15%;
      display: block;
    }

    /* ===== TITRE ===== */

    h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* ===== 3 CATEGORIES ===== */

    .categories {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .category {
      position: relative;
      height: 145px;
      background: #151515;
      border: 1px solid #303030;
      border-radius: 17px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .15s ease;
    }

    .category:active {
      transform: scale(.96);
    }

    .category img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .category-name {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;

      padding: 9px 4px;

      background:
        linear-gradient(
          transparent,
          rgba(0,0,0,.92)
        );

      text-align: center;
      font-size: 13px;
      font-weight: 700;
    }

    /* ===== PAGES CATEGORIES ===== */

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    .back {
      border: 1px solid #333;
      background: #151515;
      color: white;

      padding: 10px 15px;
      border-radius: 12px;

      font-size: 15px;
      margin-bottom: 20px;
      cursor: pointer;
    }

    .page-title {
      font-size: 25px;
      margin-bottom: 18px;
    }

    .content-box {
      background: #151515;
      border: 1px solid #303030;
      border-radius: 18px;
      padding: 20px;
      color: #ddd;
      line-height: 1.5;
    }

    /* VIGNETTES CATÉGORIE 1 */

.cat1-list {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.cat1-card {
  width: 100%;
  height: 105px;
  display: grid;
  grid-template-columns: 105px 1fr 45px;
  align-items: center;
  background: #111;
  border: 1px solid #333;
  border-radius: 18px;
  overflow: hidden;
  cursor: pointer;
}

.cat1-card img {
  width: 105px;
  height: 105px;
  object-fit: cover;
}

.cat1-name {
  padding-left: 18px;
  font-size: 20px;
  font-weight: bold;
  color: white;
}

.cat1-arrow {
  font-size: 32px;
  color: white;
  text-align: center;
}

  </style>
</head>

<body>

<div class="app">

  <!-- ================= ACCUEIL ================= -->

  <div id="home" class="page active">

    <div class="logo-box">
      <!-- On ajoutera ton vrai logo ici -->
      <img
        src="./IMG_1079.jpeg"
        alt="Doctor Pharma 33">
    </div>

    <h1>Doctor Pharma 33</h1>

    <div class="subtitle">
      Sélectionnez une catégorie
    </div>


    <div class="categories">

      <!-- CATEGORIE 1 -->

      <div class="category"
           onclick="openPage('cat1')">

        <img
          src="categorie1.jpg"
          alt="Catégorie 1">

        <div class="category-name">
          CATÉGORIE 1
        </div>

      </div>


      <!-- CATEGORIE 2 -->

      <div class="category"
           onclick="openPage('cat2')">

        <img
          src="categorie2.jpg"
          alt="Catégorie 2">

        <div class="category-name">
          CATÉGORIE 2
        </div>

      </div>


      <!-- CATEGORIE 3 -->

      <div class="category"
           onclick="openPage('cat3')">

        <img
          src="categorie3.jpg"
          alt="Catégorie 3">

        <div class="category-name">
          CATÉGORIE 3
        </div>

      </div>

    </div>

  </div>


  <!-- ================= CATEGORIE 1 ================= -->

  <div id="cat1" class="page">

    <button class="back"
            onclick="home()">
      ← Retour
    </button>

    <h2 class="page-title">
      Catégorie 1
    </h2>

   <div class="cat1-list">

  <div class="cat1-card" onclick="openPage('120u')">
    <img src="120u.jpg" alt="120u">
    <div class="cat1-name">120u</div>
    <div class="cat1-arrow">›</div>
  </div>

  <div class="cat1-card" onclick="openPage('frozen')">
    <img src="frozen.jpg" alt="Frozen">
    <div class="cat1-name">FROZEN</div>
    <div class="cat1-arrow">›</div>
  </div>

  <div class="cat1-card" onclick="openPage('static')">
    <img src="static.jpg" alt="Static">
    <div class="cat1-name">STATIC</div>
    <div class="cat1-arrow">›</div>
  </div>

  <div class="cat1-card" onclick="openPage('double-static')">
    <img src="double-static.jpg" alt="Double Static">
    <div class="cat1-name">DOUBLE STATIC</div>
    <div class="cat1-arrow">›</div>
  </div>

</div>

  </div>


  <!-- ================= CATEGORIE 2 ================= -->

  <div id="cat2" class="page">

    <button class="back"
            onclick="home()">
      ← Retour
    </button>

    <h2 class="page-title">
      Catégorie 2
    </h2>

    <div class="content-box">
      Contenu de la catégorie 2.
    </div>

  </div>


  <!-- ================= CATEGORIE 3 ================= -->

  <div id="cat3" class="page">

    <button class="back"
            onclick="home()">
      ← Retour
    </button>

    <h2 class="page-title">
      Catégorie 3
    </h2>

    <div class="content-box">
      Contenu de la catégorie 3.
    </div>

  </div>

</div>


<script>

  function openPage(id) {

    document
      .querySelectorAll(".page")
      .forEach(page => {
        page.classList.remove("active");
      });

    document
      .getElementById(id)
      .classList.add("active");

    window.scrollTo(0, 0);
  }


  function home() {

    document
      .querySelectorAll(".page")
      .forEach(page => {
        page.classList.remove("active");
      });

    document
      .getElementById("home")
      .classList.add("active");

    window.scrollTo(0, 0);
  }

</script>

</body>
</html>
