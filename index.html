<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doctor Pharma 33</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0d;
      color: white;
      font-family: Arial, sans-serif;
    }

    .header {
      text-align: center;
      padding: 35px 20px 25px;
      background: linear-gradient(180deg, #171719, #0b0b0d);
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: auto;
      border-radius: 50%;
      background: #252525;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 42px;
      border: 2px solid #444;
    }

    h1 {
      margin: 15px 0 5px;
      font-size: 27px;
    }

    .subtitle {
      color: #999;
      font-size: 14px;
    }

    .container {
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    .welcome {
      background: #171719;
      padding: 18px;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    .welcome h2 {
      margin-top: 0;
    }

    .categories {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .category {
      background: #1c1c1f;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 25px 10px;
      text-align: center;
      cursor: pointer;
    }

    .category:active {
      transform: scale(.97);
    }

    .icon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    .category-title {
      font-weight: bold;
      font-size: 17px;
    }

    .bottom {
      margin-top: 30px;
      text-align: center;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo">👨‍⚕️</div>
    <h1>Doctor Pharma 33</h1>
    <div class="subtitle">Bienvenue sur notre espace</div>
  </div>

  <div class="container">

    <div class="welcome">
      <h2>👋 Bienvenue</h2>
      <p>Sélectionnez une catégorie pour découvrir notre menu.</p>
    </div>

    <div class="categories">

      <div class="category" onclick="openCategory('categorie1')">
        <div class="icon">📦</div>
        <div class="category-title">Catégorie 1</div>
      </div>

      <div class="category" onclick="openCategory('categorie2')">
        <div class="icon">⭐</div>
        <div class="category-title">Catégorie 2</div>
      </div>

      <div class="category" onclick="openCategory('nouveautes')">
        <div class="icon">🔥</div>
        <div class="category-title">Nouveautés</div>
      </div>

      <div class="category" onclick="openCategory('contact')">
        <div class="icon">💬</div>
        <div class="category-title">Contact</div>
      </div>

    </div>

    <div class="bottom">
      Doctor Pharma 33
    </div>

  </div>

  <script>
    function openCategory(category) {
      alert("Ouverture : " + category);
    }
  </script>

</body>
</html>
